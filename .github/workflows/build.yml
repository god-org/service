name: Build

on:
  workflow_dispatch:
    inputs:
      f_rbld:
        description: 强制构建
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sb_ver: ${{ steps.get.outputs.sb_ver }}
      cf_ver: ${{ steps.get.outputs.cf_ver }}
      sb_upd: ${{ steps.get.outputs.sb_upd }}
      cf_upd: ${{ steps.get.outputs.cf_upd }}
      msg: ${{ steps.get.outputs.msg }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 获取信息
        id: get
        env:
          SB_SRC: SagerNet/sing-box
          CF_SRC: cloudflare/cloudflared
        run: |
          while IFS=: read -r key val; do
            [[ $key == *sing-box* ]] && sb_old=${val//[[:space:]]/}
            [[ $key == *cloudflared* ]] && cf_old=${val//[[:space:]]/}
            [[ $sb_old && $cf_old ]] && break
          done <README.md

          sb_ver=$(gh release list -R "$SB_SRC" -L 1 --exclude-drafts \
            --exclude-pre-releases --json tagName -q '.[0].tagName')
          cf_ver=$(gh release list -R "$CF_SRC" -L 1 --exclude-drafts \
            --exclude-pre-releases --json tagName -q '.[0].tagName')

          [[ $sb_old != "$sb_ver" ]] && sb_upd=1 || sb_upd=0
          [[ $cf_old != "$cf_ver" ]] && cf_upd=1 || cf_upd=0

          printf '%s\n' "sb_ver=$sb_ver" "cf_ver=$cf_ver" \
            "sb_upd=$sb_upd" "cf_upd=$cf_upd" >>"$GITHUB_OUTPUT"

          ((sb_upd || cf_upd)) || exit 0
          printf -v now_t '%(%F %T)T' -1
          msg="$now_t Build to $sb_ver and $cf_ver"
          printf '%s\n' "msg=$msg" >>"$GITHUB_OUTPUT"

  build:
    needs:
      - check
    runs-on: ubuntu-latest
    if: needs.check.outputs.msg != '' || inputs.f_rbld
    steps:
      - name: 配置 QEMU 跨架构支持
        uses: docker/setup-qemu-action@v4

      - name: 配置 Docker Buildx 构建工具
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker 镜像仓库
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: img
        env:
          REPO: ${{ github.repository }}
          SB_VER: ${{ needs.check.outputs.sb_ver }}
          CF_VER: ${{ needs.check.outputs.cf_ver }}
        run: |
          list=(
            "ghcr.io/$REPO:latest"
            "ghcr.io/$REPO:$SB_VER-$CF_VER"
          )

          printf '%s\n' 'tags<<EOF' "${list[@]}" 'EOF' >>"$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SB_VER=${{ needs.check.outputs.sb_ver }}
            CF_VER=${{ needs.check.outputs.cf_ver }}
          secrets: DL_URL=${{ secrets.DL_URL }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mark:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success' && !cancelled()
    steps:
      - name: 检出全部代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 更新版本信息
        env:
          SB_VER: ${{ needs.check.outputs.sb_ver }}
          CF_VER: ${{ needs.check.outputs.cf_ver }}
          SB_UPD: ${{ needs.check.outputs.sb_upd }}
          CF_UPD: ${{ needs.check.outputs.cf_upd }}
        run: |
          ((!SB_UPD)) || sed -i "/\*\*sing-box\*\*/ s|:.*|: $SB_VER|" README.md
          ((!CF_UPD)) || sed -i "/\*\*cloudflared\*\*/ s|:.*|: $CF_VER|" README.md

      - name: 提交代码
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ needs.check.outputs.msg }}

      - name: 发送结果至 Telegram
        uses: appleboy/telegram-action@v1.0.2
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            <b>🚀 Service 构建报告</b>

            ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}

            <b>📦 项目信息</b>
            仓库：<code>${{ github.repository }}</code>
            分支：<code>${{ github.ref_name }}</code>
            编号：<code>${{ github.run_number }}</code>
            版本：<code>${{ needs.check.outputs.sb_ver }}-${{ needs.check.outputs.cf_ver }}</code>

            <b>👤 触发信息</b>
            账号：<code>${{ github.actor }}</code>
            触发：<code>${{ github.event_name }}</code>
            哈希：<code>${{ github.sha }}</code>
            提交：<code>${{ needs.check.outputs.msg }}</code>

            <b>🔗 快速链接</b>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">📋 查看完整日志</a>
            <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">💻 查看代码变更</a>
